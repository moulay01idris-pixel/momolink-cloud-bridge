name: MoMoLink Cloud Bridge

# الجدولة الداخلية لـ GitHub مخنوقة (فجوات 4.5–11.7 ساعة بدل 5 دقائق).
# لذلك نعتمد سلسلة self-dispatch: كل تشغيل يُطلق التالي بعد ~4 دقائق نوم.
# للبدء/إعادة البدء: workflow_dispatch يدوي. للإيقاف: متغير الريبو REPO_DISABLE_AUTO_LOOP=true.
on:
  workflow_dispatch:
    inputs:
      prime:
        description: "Seed current messages without replying"
        type: boolean
        default: false
      chain:
        description: "Internal flag: dispatched by the chain (do not start manually)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: momolink-cloud-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Setup Xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Run cloud bridge worker
        env:
          FB_APPSTATE: ${{ secrets.FB_APPSTATE }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TARGET_THREAD_ID: ${{ vars.TARGET_THREAD_ID || '1618729240054631' }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          HEADLESS: "0"
          LOCAL_STALE_MIN: "15"
          PRIME_ONLY: ${{ inputs.prime && '1' || '0' }}
        run: xvfb-run -a node worker.mjs

      - name: Persist checkpoint + health
        if: always()
        run: |
          git config user.name "cloud-bridge"
          git config user.email "cloud-bridge@users.noreply.github.com"
          git add checkpoint.json mode.json health.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update checkpoint/health" || true
          fi
          # تفادي رفض الـ push عند تزامن تشغيلين: ادمج قبل الدفع.
          git pull --rebase origin main || true
          git push || true

      - name: Continue chain (~5 min)
        if: always() && vars.REPO_DISABLE_AUTO_LOOP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "chain: sleeping 240s before next run"
          sleep 240
          curl -fSs -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bridge.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}","inputs":{"prime":false,"chain":true}}'
          echo "chain: next run dispatched"
