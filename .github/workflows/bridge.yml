name: MoMoLink Cloud Bridge

# الجدولة الداخلية لـ GitHub مخنوقة (فجوات 4.5–11.7 ساعة بدل 5 دقائق).
# لذلك نعتمد سلسلة self-dispatch: كل تشغيل يُطلق التالي بعد ~4 دقائق نوم.
# للبدء/إعادة البدء: workflow_dispatch يدوي. للإيقاف: متغير الريبو REPO_DISABLE_AUTO_LOOP=true.
on:
  workflow_dispatch:
    inputs:
      prime:
        description: "Seed current messages without replying"
        type: boolean
        default: false
      chain:
        description: "Internal flag: dispatched by the chain (do not start manually)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: momolink-cloud-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Locate Chrome
        id: chrome
        run: |
          CANDIDATE="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CANDIDATE" ]; then
            echo "::error::No Chrome/Chromium binary found on runner"
            exit 1
          fi
          echo "path=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "Using browser: $CANDIDATE"

      - name: Run cloud bridge worker
        env:
          FB_APPSTATE: ${{ secrets.FB_APPSTATE }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TARGET_THREAD_ID: ${{ vars.TARGET_THREAD_ID || '1618729240054631' }}
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
          PRIME_ONLY: ${{ inputs.prime && '1' || '0' }}
        run: node worker.mjs

      - name: Persist checkpoint + health
        if: always()
        run: |
          git config user.name "cloud-bridge"
          git config user.email "cloud-bridge@users.noreply.github.com"
          git add checkpoint.json mode.json health.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update checkpoint/health" || true
            git push || true
          fi

      - name: Continue chain (~5 min)
        if: always() && vars.REPO_DISABLE_AUTO_LOOP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "chain: sleeping 240s before next run"
          sleep 240
          gh api repos/${{ github.repository }}/actions/workflows/${{ github.workflow }}/dispatches \
            -f ref=${{ github.ref_name }} \
            -f inputs='{"prime": false, "chain": true}'
          echo "chain: next run dispatched"
