name: MoMoLink Cloud Bridge

on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:
    inputs:
      prime:
        description: "Seed current messages without replying"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: momolink-cloud-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Locate Chrome
        id: chrome
        run: |
          CANDIDATE="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CANDIDATE" ]; then
            echo "::error::No Chrome/Chromium binary found on runner"
            exit 1
          fi
          echo "path=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "Using browser: $CANDIDATE"

      - name: Run cloud bridge worker
        env:
          FB_APPSTATE: ${{ secrets.FB_APPSTATE }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TARGET_THREAD_ID: ${{ vars.TARGET_THREAD_ID || '1618729240054631' }}
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
          PRIME_ONLY: ${{ inputs.prime && '1' || '0' }}
        run: node worker.mjs

      - name: Persist checkpoint
        if: always()
        run: |
          git config user.name "cloud-bridge"
          git config user.email "cloud-bridge@users.noreply.github.com"
          git add checkpoint.json mode.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update message checkpoint"
            git push
          fi
